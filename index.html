  /* Only the game-detail sheet is custom; everything else uses Lumosity's own compiled classes. */

  .l2-btn{border:0;cursor:pointer;padding:10px 20px;border-radius:999px;font-size:.875rem;font-weight:700;font-family:inherit}
  .l2-btn-primary{background:var(--color-interactive-filled-default,#fa6432);color:#fff}

</div>

<div class="l2-modal-back" id="modalBack">
  <div class="l2-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <img id="modalImg" alt="">
    <div class="l2-modal-body">
      <h3 id="modalTitle"></h3>
      <div class="l2-modal-meta" id="modalMeta"></div>
      <p id="modalDesc"></p>
      <div class="l2-modal-actions">
        <button class="l2-btn l2-btn-primary" id="modalPlay">Play now</button>
        <button class="l2-btn l2-btn-ghost" id="modalClose">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
const CATEGORIES = ["All","Speed","Memory","Attention","Flexibility","Reasoning","Math","Language"];

/* name, area, skill, description, earlyAccess */
const GAMES = {
  "disillusion":["Disillusion","Flexibility","Task Switching","Put your Task-Switching skills to work by matching tiles as quickly as you can.",0],
  "eagle-eye":["Eagle Eye","Attention","Field of View","Put your Field of View to the test by spotting birds in the corner of your eye.",0],
  "space-trace":["Space Trace","Flexibility","Spatial Fluency","Practice your Spatial Fluency skills by creating as many unique patterns as possible.",0],
  "train-of-thought":["Train of Thought","Attention","Divided Attention","Exercise your Divided Attention by directing each train to its matching station.",0],
  "highway-hazards":["Highway Hazards","Speed","Information Processing","Exercise your Information Processing skills by dodging collisions in a race through the desert.",0],
  "penguin-rally":["Penguin Rally","Speed","Spatial Orientation","Exercise your Spatial Orientation by beating your rival to the fish.",0],
  "river-ranger":["River Ranger","Speed","Information Processing","Challenge your Information Processing by quickly spotting animals in a river.",0],
  "spatial-speed-match":["Spatial Speed Match","Speed","Information Processing","Train your Information Processing by determining whether the spatial orientation of the cards match.",0],
  "speed-match":["Speed Match","Speed","Information Processing","Train your Information Processing by quickly determining whether the cards match.",0],
  "speed-match-overdrive":["Speed Match Overdrive","Speed","Information Processing","An advanced version of Speed Match. Put your Information Processing skills to the test.",0],
  "speed-pack":["Speed Pack","Speed","Visualization","Practice Visualization by quickly fitting the camera into an already filled suitcase.",0],
  "splitting-seeds":["Splitting Seeds","Speed","Visualization","Test your Visualization skills by quickly dividing seeds into two equal groups.",0],
  "cognition-kitchen":["Cognition Kitchen","Memory","Short-Term Memory","Train your Short-Term Memory by memorizing a recipe, then preparing it without your cookbook.",0],
  "familiar-faces":["Familiar Faces","Memory","Face-Name Memory","Exercise your Face-Name Memory by accurately remembering customers' names and orders.",0],
  "follow-that-frog":["Follow That Frog","Memory","Working Memory","Exercise your Working Memory by memorizing and repeating the orange frog's jumps.",0],
  "memory-match":["Memory Match","Memory","Working Memory","Train your Working Memory by determining whether the symbol matches the one presented two cards ago.",0],
  "memory-match-overdrive":["Memory Match Overdrive","Memory","Working Memory","Train your Working Memory by determining whether the symbols match the one presented three cards ago.",0],
  "memory-matrix":["Memory Matrix","Memory","Spatial Recall","Train your Spatial Recall by remembering the pattern of tiles.",0],
  "memory-serves":["Memory Serves","Memory","Working Memory","Exercise your Working Memory by delivering bags to hotel guests.",0],
  "pinball-recall":["Pinball Recall","Memory","Working Memory","Train your Working Memory by memorizing the bumper locations before they vanish.",0],
  "rotation-matrix":["Rotation Matrix","Memory","Working Memory","Train your Working Memory by remembering the pattern of tiles after they rotate.",0],
  "tidal-treasures":["Tidal Treasures","Memory","Short-Term Memory","Train your Short-Term Memory by choosing objects you haven't clicked before.",0],
  "whats-my-name":["What's My Name?","Memory","Face-Name Recall","Practice your Face-Name Recall in this meet-and-greet game.",0],
  "assist-ants":["Assist Ants","Attention","Divided Attention","Train your Divided Attention skills by preventing ant collisions.",1],
  "feel-the-beat":["Feel the Beat","Attention","Timing","Exercise your Timing skills by playing the drums on your keyboard.",0],
  "lost-in-migration":["Lost in Migration","Attention","Selective Attention","Train your Selective Attention by focusing on the direction of the center bird.",0],
  "playing-koi":["Playing Koi","Attention","Divided Attention","Train your Divided Attention skills by processing multiple streams of information as you feed fish.",0],
  "skyrise":["Skyrise","Attention","Field of View","Test your Field of View by remembering numbers flashed across the screen.",0],
  "star-search":["Star Search","Attention","Selective Attention","Exercise your Selective Attention skills by quickly finding the unique object.",0],
  "trouble-brewing":["Trouble Brewing","Attention","Divided Attention","Exercise your Divided Attention skills by serving coffee orders at a busy cafe.",0],
  "brain-shift":["Brain Shift","Flexibility","Task Switching","Test your Task Switching by switching quickly between changing rules.",0],
  "brain-shift-overdrive":["Brain Shift Overdrive","Flexibility","Task Switching","An advanced version of Brain Shift. Exercise your Task-Switching abilities.",0],
  "color-match":["Color Match","Flexibility","Response Inhibition","Exercise your Response Inhibition by comparing one word's meaning to another word's color.",0],
  "ebb-and-flow":["Ebb and Flow","Flexibility","Task Switching","Test your Task-Switching abilities by shifting focus between where the leaves point and how they move.",0],
  "robot-factory":["Robot Factory","Flexibility","Response Inhibition","Build as many robots as possible. Exercise your Response Inhibition as you ignore incorrect parts.",0],
  "fuse-clues":["Fuse Clues","Reasoning","Logical Reasoning","Exercise your Logical Reasoning to fix a power outage in an apartment building.",0],
  "masterpiece":["Masterpiece","Reasoning","Spatial Reasoning","Exercise your Spatial Reasoning by fitting pieces of a mosaic together.",0],
  "organic-order":["Organic Order","Reasoning","Logical Reasoning","Challenge your Logical Reasoning by planting seeds in the right order.",0],
  "pet-detective":["Pet Detective","Reasoning","Planning","Exercise your route Planning skills by returning lost pets using the shortest paths.",0],
  "pirate-passage":["Pirate Passage","Reasoning","Planning","Put your Planning skills to work by avoiding pirates on the path to treasure.",0],
  "ruled-out":["Ruled Out","Reasoning","Logical Reasoning","Train your Logical Reasoning by determining the hidden rule and selecting cards that follow it.",0],
  "jigsaw-sudoku":["Speedoku","Reasoning","Logical Reasoning","Train your Logical Reasoning by deducing which symbol belongs in every row, column, and shape.",1],
  "chalkboard-challenge":["Chalkboard Challenge","Math","Numerical Estimation","Test your Numerical Estimation skills by quickly finding the greater solution.",0],
  "halve-your-cake":["Halve Your Cake","Math","Proportional Reasoning","Exercise your Proportional Reasoning skills by measuring ingredients for delicious baked goods.",0],
  "magic-chance":["Magic Chance","Math","Probabilistic Reasoning","Train your Probabilistic Reasoning skills by setting up card tricks.",0],
  "raindrops":["Raindrops","Math","Arithmetic","Test your Arithmetic skills by solving math problems before they hit the water.",0],
  "top-that":["Top That","Math","Numerical Estimation","Exercise your Numerical Estimation skills to win the most expensive prize.",0],
  "contextual":["Contextual","Language","Reading Comprehension","Exercise your Reading Comprehension by replacing incorrectly used words.",0],
  "continuum":["Continuum","Language","Vocabulary","Exercise your Vocabulary by discerning subtle differences between words.",0],
  "editors-choice":["Editor's Choice","Language","Vocabulary","Train your Vocabulary by quickly selecting synonyms.",0],
  "taking-root":["Taking Root","Language","Vocabulary","Exercise your Vocabulary by learning the building blocks of words.",0],
  "word-bubbles":["Word Bubbles","Language","Verbal Fluency","Generate words that start with the same letters to train your Verbal Fluency.",0],
  "word-snatchers":["Word Snatchers","Language","Vocabulary","Exercise your Vocabulary by unscrambling the word.",0]
};

/* Games with a playable page in this build */
const PLAYABLE = {
  "disillusion": "games/disillusion/",
  "space-trace": "games/space-trace/",
  "train-of-thought": "games/train-of-thought/",
  "penguin-rally": "games/penguin-rally/",
  "river-ranger": "games/river-ranger/"
};

const TODAYS = ["disillusion","eagle-eye","space-trace","train-of-thought","highway-hazards","penguin-rally","river-ranger"];
const AREA_ORDER = [
  ["Speed",["highway-hazards","penguin-rally","river-ranger","spatial-speed-match","speed-match","speed-match-overdrive","speed-pack","splitting-seeds"]],
  ["Memory",["cognition-kitchen","familiar-faces","follow-that-frog","memory-match","memory-match-overdrive","memory-matrix","memory-serves","pinball-recall","rotation-matrix","tidal-treasures","whats-my-name"]],
  ["Attention",["assist-ants","eagle-eye","feel-the-beat","lost-in-migration","playing-koi","skyrise","star-search","train-of-thought","trouble-brewing"]],
  ["Flexibility",["brain-shift","brain-shift-overdrive","color-match","disillusion","ebb-and-flow","robot-factory","space-trace"]],
  ["Reasoning",["fuse-clues","masterpiece","organic-order","pet-detective","pirate-passage","ruled-out","jigsaw-sudoku"]],
  ["Math",["chalkboard-challenge","halve-your-cake","magic-chance","raindrops","top-that"]],
  ["Language",["contextual","continuum","editors-choice","taking-root","word-bubbles","word-snatchers"]]
];

const tabsEl = document.getElementById("tabs");
const sectionsEl = document.getElementById("sections");
const searchEl = document.getElementById("search");
let activeCat = "All", query = "";

function makeTabs(){
  CATEGORIES.forEach(c=>{
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.cat = c;
    b.textContent = c;
    setTabState(b, c === activeCat);
    b.addEventListener("click", ()=>{
      activeCat = c;
      tabsEl.querySelectorAll("button").forEach(x=>setTabState(x, x.dataset.cat === c));
      render();
    });
    tabsEl.appendChild(b);
  });
}
function setTabState(btn, active){
  btn.className = active
    ? "px-4 py-[10px] text-caption-1 font-semibold border-b-2 border-border-interactive text-text-interactive"
    : "px-4 py-[10px] text-caption-1 font-semibold text-neutral-cool-60";
}
function card(slug, showArea){
  const g = GAMES[slug]; if(!g) return "";
  const [name, area, skill, , early] = g;
  return `<button data-locked="false" data-gameslug="${slug}" class="block" style="opacity: 1; transform: none;">
    <div class="w-[176px] p-2 relative transition-all duration-200 rounded-md cursor-pointer bg-transparent hover:bg-neutral-warm-95">
      ${early ? '<div class="absolute top-1 left-1 z-1 text-xs font-semibold uppercase tracking-widest text-white text-center px-2 py-0.5 rounded-full" style="background-color: rgb(250, 100, 50);">Early Access</div>' : ""}
      <div class="flex flex-col text-left pb-2">
        <img src="assets/games/${slug}.svg" alt="${name.replace(/"/g,"&quot;")}" width="160" height="112" class="rounded-t-[4px] transition-all duration-200 scale-100">
        <div class="mt-2 mb-0.5 text-base font-semibold text-text-default">${name}</div>
        ${showArea ? `<div class="text-text-subdued text-xs font-semibold uppercase tracking-widest leading-4">${area}</div>` : ""}
        <div class="text-text-subdued text-sm font-light">${skill}</div>
      </div>
    </div>
  </button>`;
}
function section(title, slugs, showArea, extra){
  return `<div class="w-full${extra||""}">
    <div class="flex items-center leading-[0.1em]"><span class="text-subheading-1 text-text-default">${title}</span></div>
    <div class="grid " style="grid-template-columns: repeat(auto-fit, 176px); gap: 16px 0px; margin-left: -8px; padding: 16px 0px; position: relative; place-items: flex-start;">${slugs.map(s=>card(s, showArea)).join("")}</div>
  </div>`;
}
function render(){
  const q = query;
  const matches = slug => {
    if(!q) return true;
    const g = GAMES[slug];
    return (g[0]+" "+g[1]+" "+g[2]).toLowerCase().includes(q);
  };

  if(q || activeCat !== "All"){
    let slugs = [];
    if(activeCat === "All"){
      slugs = Object.keys(GAMES).filter(matches);
    } else {
      const group = AREA_ORDER.find(a=>a[0] === activeCat);
      slugs = group ? group[1].filter(matches) : [];
    }
    if(slugs.length){
      sectionsEl.innerHTML = section(q ? "Search Results" : activeCat, slugs, true, " mb-6");
    } else {
      sectionsEl.innerHTML = `<div class="w-full mb-6"><div class="text-caption-1 text-text-subdued py-4">No results for '${(q || activeCat).replace(/</g,"&lt;")}'. Try searching for a game name like Eagle Eye.</div></div>`;
    }
  } else {
    sectionsEl.innerHTML =
      section("Today's games", TODAYS, true, " mb-6") +
      AREA_ORDER.map(([area, slugs]) => section(area, slugs, false)).join("");
  }
  sectionsEl.querySelectorAll("button[data-gameslug]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const dest = PLAYABLE[b.dataset.gameslug];
      if (dest) window.location.href = dest;
      else openModal(b.dataset.gameslug);
    });
  });
}

const modalBack = document.getElementById("modalBack");
function openModal(slug){
  const g = GAMES[slug]; if(!g) return;
  document.getElementById("modalImg").src = `assets/games/${slug}.svg`;
  document.getElementById("modalImg").alt = g[0];
  document.getElementById("modalTitle").textContent = g[0];
  document.getElementById("modalMeta").textContent = `${g[1]} · ${g[2]}${g[4] ? " · Early Access" : ""}`;
  document.getElementById("modalDesc").textContent = g[3];
  modalBack.classList.add("open");
}
document.getElementById("modalClose").addEventListener("click", ()=>modalBack.classList.remove("open"));
modalBack.addEventListener("click", e=>{ if(e.target === modalBack) modalBack.classList.remove("open"); });
document.addEventListener("keydown", e=>{ if(e.key === "Escape") modalBack.classList.remove("open"); });
document.getElementById("modalPlay").addEventListener("click", ()=>{
  const d = document.getElementById("modalDesc");
  if(!d.dataset.noted){
    d.textContent += " (Static port — the game itself isn't bundled.)";
    d.dataset.noted = "1";
  }
});
searchEl.addEventListener("input", e=>{ query = e.target.value.trim().toLowerCase(); render(); });

makeTabs();
render();
</script>
</body>
</html>
